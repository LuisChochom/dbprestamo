services:
  umg:
    image: postgres:16-alpine
    container_name: umg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - umg_pgdata:/var/lib/postgresql/data

volumes:
  umg_pgdata: